# Baby Lights as an Xcode app — the BabyLights package next door, linked
# as a library, here as an iOS (device/simulator) and macOS app.
# Regenerate the .xcodeproj after editing this:
#
#     cd BabyLightsApp && xcodegen
#
name: BabyLightsApp
options:
  bundleIdPrefix: com.kivyschool
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.0"
  # Only the shared `BabyLightsApp` scheme is wanted, not one per package
  # target.
  postGenCommand: >-
    mkdir -p BabyLightsApp.xcodeproj/project.xcworkspace/xcshareddata &&
    printf '%s\n'
    '<?xml version="1.0" encoding="UTF-8"?>'
    '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
    '<plist version="1.0">'
    '<dict>'
    '	<key>IDEWorkspaceSharedSettings_AutocreateContextsIfNeeded</key>'
    '	<false/>'
    '</dict>'
    '</plist>'
    > BabyLightsApp.xcodeproj/project.xcworkspace/xcshareddata/WorkspaceSettings.xcsettings

# The app is the package; NucleantSwiftUI comes with it.
packages:
  BabyLights:
    path: ../BabyLights

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"

targets:
  BabyLightsApp:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      # Just `@main struct BabyLightsApp: NucleantApp` — the package's own
      # entry file, so the two builds share it too.
      - path: ../BabyLights/Sources/BabyLightsApp
    dependencies:
      - package: BabyLights
        product: BabyLights
    settings:
      base:
        PRODUCT_NAME: BabyLights
        # The .app is BabyLights; the module cannot be, that is the library's.
        PRODUCT_MODULE_NAME: BabyLightsApp
        PRODUCT_BUNDLE_IDENTIFIER: com.kivyschool.babylights
        # Sign to run locally; a real iOS device needs a team — set it under
        # Signing & Capabilities, or here as DEVELOPMENT_TEAM.
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "-"
        "CODE_SIGN_IDENTITY[sdk=iphoneos*]": "Apple Development"
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator macosx
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: "NO"
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../Frameworks"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Baby Lights
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
    scheme:
      testTargets: []
      gatherCoverageData: false
